name: privacy

# This repo is public. Fail when a change would publish local paths or
# personal info — see AGENTS.md "Privacy".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check every commit in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/check-privacy.sh "origin/${BASE_REF}"

      - name: Check every tracked file
        run: bash scripts/check-privacy.sh --all
