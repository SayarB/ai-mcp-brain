# Copy to config.toml via `npm run setup` / `bun run setup`, or copy manually.
# Env BRAIN_VAULT overrides vault_path.
# Prefer a non-cloud-synced path if your editor sandbox blocks iCloud/OneDrive.

vault_path = "~/Obsidian/My Brain"

# [inject] paths are optional — OS defaults are applied in code for
# Cursor, Claude, Codex, and Zed (including Windows AppData for Zed).

# Optional Jira work desk. Secrets stay in gitignored `.env` (see `.env.example`).
# [jira]
# base_url = "https://your-domain.atlassian.net"
# email_env = "JIRA_EMAIL"
# token_env = "JIRA_API_TOKEN"
# default_jql = "assignee = currentUser() AND statusCategory != Done AND sprint in openSprints()"
# default_project = "AD"
# default_issue_type = "Task"
# For all assigned (not just sprints), agents should ask then use scope=all on tools.
# Releases need Manage Versions / Administer Projects on the project.
